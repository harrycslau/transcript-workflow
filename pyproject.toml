[project]
name = "brain"
version = "0.1.0"
description = "Local-first transcript workflow: transcribe, summarize, tag, and search recordings."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
brain = "brainlib.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainlib", "src/brain", "src/workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
# DJANGO_SETTINGS_MODULE and BRAIN_CONFIG are set in tests/conftest.py at
# import time (before pytest-django's trylast pytest_configure sets up
# Django), pointing at an isolated temp configuration.
