# Brain example configuration.
# Copy to config/config.yaml and adjust. Relative paths are resolved
# against the project root (the directory containing pyproject.toml).

storage:
  inbox: ./data/inbox
  database: ./data/database/brain.sqlite3
  transcripts: ./data/transcripts
  exports: ./data/exports
  logs: ./data/logs
  temp: ./data/temp

macwhisper:
  command: /usr/local/bin/mw
  # Legacy key kept for backward compatibility; superseded by routing.profiles.
  model: null
  language: auto
  speakers: true
  # Convert non-PCM-WAV input (MP3/M4A/...) to a temporary 16 kHz mono
  # PCM WAV under data/temp before full transcription. The original file
  # is read-only and never modified; the temp file is removed after the
  # attempt (and orphaned copies are swept during recovery).
  normalize_input: true
  # One automatic --no-speakers retry after a stable diarization-specific
  # failure (e.g. apple zh models reject --speakers). Default OFF: when
  # the fallback succeeds the transcript has no speaker labels, and the
  # degradation is recorded in the attempt history and reported.
  speakers_fallback: false
  output_format: json
  # A file must be unchanged for this long before it is hashed.
  file_stable_seconds: 30
  # Hard maximum cap for a single `mw transcribe` run. Short audio gets
  # a small minimum allowance; longer audio scales with duration but
  # never exceeds this cap.
  cli_timeout_seconds: 7200

  routing:
    enabled: true
    # When false, automatic suggestions always wait for human review.
    auto_transcribe: true
    # Automatic routing requires confidence >= threshold. Note: this is a
    # router score, not a calibrated probability.
    confidence_threshold: 0.80
    default_profile: european

    # Conservative deterministic auto-route gate used ONLY when the oMLX
    # classifier is invalid or unavailable. ALL conditions must hold for
    # exactly one enabled Chinese family: chinese family verdict,
    # unambiguous zh verdict, minimum CJK ratio, minimum target marker
    # score, dominance ratio over opposing marker scores, a separate
    # absolute ceiling on opposing scores, and non-silent window
    # coverage. These are heuristic evidence thresholds, NOT calibrated
    # probabilities; anything weaker/ambiguous/contradictory stays in
    # Needs Review. Cantonese and Mandarin have independent thresholds
    # and kill switches; European has no heuristic gate. When
    # auto_transcribe is false, gated recordings wait in Needs Review
    # like every other automatic route.
    heuristic_auto_route:
      enabled: true
      min_non_silent_windows: 2
      min_cjk_ratio: 0.60
      cantonese_enabled: true
      cantonese_min_score: 4.0
      mandarin_enabled: true
      mandarin_min_score: 4.0
      dominance_ratio: 3.0
      max_opposing_score: 0.5

    # language: null means "do not pass --language". Validated against
    # MacWhisper 14.7.1: parakeet rejects `--language multilingual` and
    # detects language internally; apple zh models run without the flag.
    profiles:
      cantonese:
        model: apple:zh-HK
        language: null
      mandarin:
        model: apple:zh-CN
        language: null
      european:
        model: parakeet-pro:nvidia_parakeet-v3
        language: null
      # Installed but not the default; manual selection only.
      european_small:
        model: parakeet-pro:nvidia_parakeet-v3_494MB
        language: null
        manual_only: true

llm:
  provider: openai_compatible
  base_url: http://localhost:8000/v1
  model: ""
  api_key_env: BRAIN_LLM_API_KEY
  temperature: 0.2
  timeout_seconds: 600

# Step 3 summarization. Limits are in characters:
# - max_input_characters: per-REQUEST hard cap on the fully serialized
#   request payload (dynamic input plus prompt scaffolding and JSON
#   escaping). Not a total-transcript limit.
# - chunk_characters / chunk_overlap_characters: map-stage chunk target
#   and trailing-segment overlap (overlap < chunk_characters).
# - max_chunk_count / max_total_characters: hard caps on map calls and
#   total transcript size. Exceeding either fails cleanly with
#   input_too_large (never truncates) and creates no Summary.
summarization:
  enabled: true
  prompt_version: "1"
  max_input_characters: 120000
  chunk_characters: 24000
  chunk_overlap_characters: 1000
  max_chunk_count: 8
  max_total_characters: 960000
  temperature: 0.2
  max_output_tokens: 3000

embedding:
  base_url: http://localhost:8000/v1
  model: ""
  api_key_env: BRAIN_LLM_API_KEY

# Web interface presentation (Step 4). Integers only, positive.
web:
  # Recordings shown per page on the recordings list.
  recordings_per_page: 25
  # Transcript segments rendered per page on transcript views.
  transcript_segments_per_page: 200

retention:
  enabled: false
  audio_days: 3
  delete_mode: permanent
  require_transcript: true
  require_summary: true

# Configurable multi-select tags (Step 3). Add or remove entries freely:
# removed tags are retired (kept on historical records), never deleted.
tags:
  allowed:
    - name: Family
      description: Family, relatives, home and personal family matters
    - name: Seminar
      description: Seminars, workshops, talks and conferences
    - name: Academic
      description: Research, teaching and academic work
    - name: Read2Learn
      description: Notes or reflections from reading
    - name: WisdomEd
      description: Wisdom Education work and related planning
    - name: Unknown
      description: Use only when no configured tag fits
